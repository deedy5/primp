name: CI

# Pull requests into main: lint, test and build wheels for every platform.
# Push to main (i.e. a merged PR): same, then — if the version in Cargo.toml
# has no `v<version>` tag yet — create that tag and a GitHub Release with all
# wheels + sdist attached. Bump `version` in Cargo.toml, crates/primp and
# crates/primp-python to cut a new release.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v6
      - name: Read version and check for an existing tag
        id: v
        shell: bash
        run: |
          set -euo pipefail
          ws=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          core=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/primp/Cargo.toml | head -1)
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/primp-python/Cargo.toml | head -1)
          if [ "$ws" != "$core" ] || [ "$ws" != "$py" ]; then
            echo "::error::Version mismatch: Cargo.toml=$ws crates/primp=$core crates/primp-python=$py"
            exit 1
          fi
          tag="v$ws"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            exists=true
          else
            exists=false
          fi
          release=false
          if [ "$exists" = false ] && [ "$GITHUB_REF" = "refs/heads/main" ] \
             && { [ "$GITHUB_EVENT_NAME" = push ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; }; then
            release=true
          fi
          echo "version=$ws" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          {
            echo "### Version \`$ws\`"
            if [ "$exists" = true ]; then
              echo "Tag \`$tag\` already exists — merging this will **not** create a release. Bump the version to release."
            elif [ "$release" = true ]; then
              echo "Release \`$tag\` will be created once all builds pass."
            else
              echo "Tag \`$tag\` does not exist yet — merging into main will create release \`$tag\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$exists" = true ] && [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "::warning::Version $ws is already released ($tag). Bump the version if this PR should produce a release."
          fi

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      # Pinned so new clippy lints in future stable releases can't block a release.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust
      - run: cargo fmt -- --check
      - run: cargo check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  linux:
    needs: [rust]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04-arm
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path crates/primp-python/Cargo.toml
          manylinux: auto
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t --manifest-path crates/primp-python/Cargo.toml
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        shell: bash
        working-directory: crates/primp-python
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install primp --no-index --find-links ../../dist --force-reinstall
          pip install pytest pytest-asyncio certifi
          pytest
      - name: pytest (aarch64)
        if: ${{ matrix.platform.target == 'aarch64' }}
        shell: bash
        working-directory: crates/primp-python
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install primp --no-index --find-links ../../dist --force-reinstall
          pip install pytest pytest-asyncio certifi
          pytest
      - name: pytest (emulated)
        if: ${{ !startsWith(matrix.platform.target, 'x86') && matrix.platform.target != 'aarch64' && matrix.platform.target != 'ppc64' }}
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.platform.target }}
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip
            pip3 install -U pip pytest pytest-asyncio certifi
          run: |
            set -e
            pip3 install primp --no-index --find-links dist --force-reinstall
            cd crates/primp-python && pytest

  musllinux:
    needs: [rust]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - uses: Swatinem/rust-cache@v2
        with:
          key: musllinux-${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path crates/primp-python/Cargo.toml
          manylinux: musllinux_1_2
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t --manifest-path crates/primp-python/Cargo.toml
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        shell: bash
        run: |
          docker run --rm -v ${{ github.workspace }}:/io -w /io alpine:latest sh -c "
            set -e
            apk add py3-pip py3-virtualenv
            python3 -m virtualenv .venv
            source .venv/bin/activate
            pip install primp --no-index --find-links dist --force-reinstall
            pip install pytest pytest-asyncio certifi
            cd crates/primp-python && pytest
          "
      - name: pytest
        if: ${{ !startsWith(matrix.platform.target, 'x86') }}
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.platform.target }}
          distro: alpine_latest
          githubToken: ${{ github.token }}
          install: |
            apk add py3-virtualenv
          run: |
            set -e
            python3 -m virtualenv .venv
            source .venv/bin/activate
            pip install pytest pytest-asyncio certifi
            pip install primp --no-index --find-links dist --force-reinstall
            cd crates/primp-python && pytest

  windows:
    needs: [rust]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-latest
            target: x86
            python_arch: x86
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13
          architecture: ${{ matrix.platform.python_arch }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path crates/primp-python/Cargo.toml
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14t
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t --manifest-path crates/primp-python/Cargo.toml
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        shell: bash
        working-directory: crates/primp-python
        run: |
          set -e
          python3 -m venv .venv
          source .venv/Scripts/activate
          pip install primp --no-index --find-links ../../dist --force-reinstall
          pip install pytest pytest-asyncio certifi
          pytest

  macos:
    needs: [rust]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path crates/primp-python/Cargo.toml
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t --manifest-path crates/primp-python/Cargo.toml
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        working-directory: crates/primp-python
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install primp --no-index --find-links ../../dist --force-reinstall
          pip install pytest pytest-asyncio certifi
          pytest

  sdist:
    needs: [rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: sdist
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/primp-python/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [version, linux, musllinux, windows, macos, sdist]
    if: ${{ needs.version.outputs.release == 'true' }}
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
      attestations: write
    env:
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List release files
        run: ls -l dist
      - name: Generate artifact attestation
        # Attestations are unavailable for private repos on some plans; never block the release on it.
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*'
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
      - name: Install uv
        if: ${{ env.HAS_PYPI_TOKEN == 'true' }}
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI (only if PYPI_API_TOKEN secret is set)
        if: ${{ env.HAS_PYPI_TOKEN == 'true' }}
        run: uv publish 'dist/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  benchmark:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [version, linux]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Download wheels
        uses: actions/download-artifact@v6
        with:
          name: wheels-linux-x86_64
      - name: Install dependencies
        run: |
          pip install -r crates/primp-python/benchmark/requirements.txt
          pip install primp --no-index --find-links ./ --force-reinstall
      - name: Start granian server
        working-directory: crates/primp-python/benchmark
        run: |
          python -m granian server:app --host 0.0.0.0 --port 8000 --interface asgi &
          sleep 5
      - name: Run benchmark
        working-directory: crates/primp-python/benchmark
        run: python benchmark.py
      - name: Commit and push benchmark image
        if: ${{ needs.version.outputs.release == 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update python benchmark image
          file_pattern: crates/primp-python/benchmark/benchmark.jpg
          branch: main
