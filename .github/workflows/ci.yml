name: CI

# Pull requests into main: lint, test and build the Windows x64 wheel.
# Push to main (i.e. a merged PR): same, then — if the version in Cargo.toml
# has no `v<version>` tag yet — create that tag and a GitHub Release with the
# win_amd64 wheel attached. Bump `version` in Cargo.toml, crates/primp and
# crates/primp-python to cut a new release.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v6
      - name: Read version and check for an existing tag
        id: v
        shell: bash
        run: |
          set -euo pipefail
          ws=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          core=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/primp/Cargo.toml | head -1)
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/primp-python/Cargo.toml | head -1)
          if [ "$ws" != "$core" ] || [ "$ws" != "$py" ]; then
            echo "::error::Version mismatch: Cargo.toml=$ws crates/primp=$core crates/primp-python=$py"
            exit 1
          fi
          tag="v$ws"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            exists=true
          else
            exists=false
          fi
          release=false
          if [ "$exists" = false ] && [ "$GITHUB_REF" = "refs/heads/main" ] \
             && { [ "$GITHUB_EVENT_NAME" = push ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; }; then
            release=true
          fi
          echo "version=$ws" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          {
            echo "### Version \`$ws\`"
            if [ "$exists" = true ]; then
              echo "Tag \`$tag\` already exists — merging this will **not** create a release. Bump the version to release."
            elif [ "$release" = true ]; then
              echo "Release \`$tag\` will be created once all builds pass."
            else
              echo "Tag \`$tag\` does not exist yet — merging into main will create release \`$tag\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$exists" = true ] && [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "::warning::Version $ws is already released ($tag). Bump the version if this PR should produce a release."
          fi

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      # Pinned so new clippy lints in future stable releases can't block a release.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust
      - run: cargo fmt -- --check
      - run: cargo check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  windows:
    name: Windows x64 wheel
    needs: [rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13
          architecture: x64
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64
      - name: Build wheel (cp310-abi3-win_amd64)
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --manifest-path crates/primp-python/Cargo.toml
      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-x64
          path: dist
      - name: pytest
        shell: bash
        working-directory: crates/primp-python
        run: |
          set -e
          python3 -m venv .venv
          source .venv/Scripts/activate
          pip install primp --no-index --find-links ../../dist --force-reinstall
          pip install pytest pytest-asyncio certifi
          pytest

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [version, windows]
    if: ${{ needs.version.outputs.release == 'true' }}
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
      attestations: write
    env:
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List release files
        run: ls -l dist
      - name: Generate artifact attestation
        # Attestations are unavailable for private repos on some plans; never block the release on it.
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*'
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
      - name: Install uv
        if: ${{ env.HAS_PYPI_TOKEN == 'true' }}
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI (only if PYPI_API_TOKEN secret is set)
        if: ${{ env.HAS_PYPI_TOKEN == 'true' }}
        run: uv publish 'dist/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
